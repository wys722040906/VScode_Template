; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = genericSTM32F103C8
src_dir = Core/Src/
; ,mylibs/lib1/src
; src_dir = Core/Src,Core/OtherSrc,mylibs/lib1/src  ; 多个目录
; src_extra_dirs = Core/OtherSrc  ; 其他的源代码目录


[env:genericSTM32F103C8]
platform = ststm32
board = genericSTM32F103C8
framework = stm32cube
build_flags = 
	-DDEBUG
	-O2
	-I include
	-I Core/Inc
	; -I mylibs/lib1/include
; build_src_filter = 
	; +<Core/Src>    ; 包含Core/Src目录
	; +<mylibs/lib1/src>  ; 包含mylibs/lib1/src目录
	; -<>
lib_deps =   
	file://mylibs/lib1  #被其他文件依赖 | 多项目复用
	file://mylibs/lib2  
	denyssene/SimpleKalmanFilter@^0.1.0
debug_tool = jlink
debug_speed = 80  # 40 - 80 - 100
debug_build_flags = 
	-g
	-O0
    ; -O ihex
upload_protocol = jlink
upload_speed = 115200
; upload_flags = 
    ; -auto  ;自动连接到目标设备并进行上传
    ; -b 115200 ;串口上传的波特率（适用于串口上传协议）
    ; -d ;启用调试信息输出
    ; -device ;指定目标设备的型号（如 STM32F103C8），用于上传时正确识别目标设备
    ; -speed 40000;设置上传的速度
	; - v ;启用详细输出模式
	; - u ;上传之前，复位目标设备
; upload_files = /path/to/firmware.hex
monitor_speed = 115200
monitor_port = /dev/ttyUSB0
monitor_filters = ansi

[env:development]
platform = ststm32
board = nucleo_f103rb
framework = arduino
build_flags = 
	-DDEBUG
	-I Core/Inc
	-I mylibs/lib1/include
build_src_filter = 
	+<Core/Src>
	-<Core/Src/core_source2.cpp>
	+<OtherDir/Src>
lib_deps = 
	Adafruit Sensor
	FastLED
	denyssene/SimpleKalmanFilter@^0.1.0

[env:production]
platform = ststm32
board = nucleo_l432kc
framework = stm32cube
build_flags = 
	-I include
	-I Core/Inc
	-DRELEASE
	-O2
build_src_filter = 
	+<Core/Src>
	-<Core/Src/core_source2.cpp>
	+<OtherDir/Src>
lib_deps = 
	Adafruit Sensor
	STM32CubeMX
	denyssene/SimpleKalmanFilter@^0.1.0

[env]
