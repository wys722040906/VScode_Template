; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = genericSTM32F103C8
src_dir = Core/Src/
; ,mylibs/lib1/src
; src_dir = Core/Src,Core/OtherSrc,mylibs/lib1/src  ; 多个目录
; src_extra_dirs = Core/OtherSrc  ; 其他的源代码目录


[env:genericSTM32F103C8]
platform = ststm32
board = genericSTM32F103C8
framework = stm32cube

board_build.stm32cube.custom_config_header = yes; 自定义的 HAL 模块的启用状态或配置选项 -- stm32fxx_hal_conf.h
board_build.stm32cube.custom_system_setup = yes;自定义的系统初始化文件 -- system_stm32fxx.c
; board_build.ldscript = custom_linker_script.ld ;调整内存布局（修改闪存和 SRAM 的分区 | 为启动代码预留特定空间）-- .ld
; board_build.stm32cube.custom_startup_file = yes ; 用户提供的启动文件(自定义复位向量表或启动行为) -- .s
; board_build.firmware = firmware/custom_firmware.bin ;自定义的启动固件文件 -- .bin
; board_upload.flash_extra_flags = --erase-sector --verify ;为烧录工具添加额外的参数(设置特定的复位模式或擦除选项)
; lib_ldf_mode = chain+ ;设置库依赖解析模式 chain+：使用链式解析并递归解析依赖。 deep+：深度递归解析。 off：关闭库解析。
 


build_flags =  ;编译器和链接器标志
	-DDEBUG
	-O2
	-I include
	-I Core/Inc
	; -I mylibs/lib1/include
; build_src_filter = 
	; +<Core/Src>    ; 包含Core/Src目录
	; +<mylibs/lib1/src>  ; 包含mylibs/lib1/src目录
	; -<>
lib_deps =   
	file://mylibs/lib1  #被其他文件依赖 | 多项目复用
	; file://mylibs/lib2  
	; denyssene/SimpleKalmanFilter@^0.1.0
debug_tool = jlink
debug_speed = 80  # 40 - 80 - 100
debug_build_flags = 
	-g
	-O0
    ; -O ihex
upload_protocol = jlink
upload_speed = 115200
; upload_flags = 
    ; -auto  ;自动连接到目标设备并进行上传
    ; -b 115200 ;串口上传的波特率（适用于串口上传协议）
    ; -d ;启用调试信息输出
    ; -device ;指定目标设备的型号（如 STM32F103C8），用于上传时正确识别目标设备
    ; -speed 40000;设置上传的速度
	; - v ;启用详细输出模式
	; - u ;上传之前，复位目标设备
; upload_files = /path/to/firmware.hex
monitor_speed = 115200
monitor_port = /dev/ttyUSB0
monitor_filters = ansi

[env:development]
platform = ststm32
board = nucleo_f103rb
framework = arduino
build_flags = 
	-DDEBUG
	-I Core/Inc
	-I mylibs/lib1/include
build_src_filter = 
	+<Core/Src>
	-<Core/Src/core_source2.cpp>
	+<OtherDir/Src>
lib_deps = 
	Adafruit Sensor
	FastLED
	denyssene/SimpleKalmanFilter@^0.1.0

[env:production]
platform = ststm32
board = nucleo_l432kc
framework = stm32cube
build_flags = 
	-I include
	-I Core/Inc
	-DRELEASE
	-O2
build_src_filter = 
	+<Core/Src>
	-<Core/Src/core_source2.cpp>
	+<OtherDir/Src>
lib_deps = 
	Adafruit Sensor
	STM32CubeMX
	denyssene/SimpleKalmanFilter@^0.1.0

[env]
